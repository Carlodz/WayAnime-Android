<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a10">
<title>WayAnime</title>
<link rel="stylesheet" href="m.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><img src="assets/logo.png" alt=""><b>Way<span>Anime</span></b></div>
    <button class="ib" id="goSearch" aria-label="بحث"></button>
  </header>
  <main>
    <section id="v-home" class="view on"></section>
    <section id="v-search" class="view">
      <div class="sbox"><i data-i="search"></i><input id="q" type="search" placeholder="ابحث عن أنمي…" enterkeyhint="search" autocomplete="off"><button id="qx" class="ib sm" hidden aria-label="مسح"></button></div>
      <div id="sres"></div>
    </section>
    <section id="v-lib" class="view"></section>
    <section id="v-me" class="view"></section>
  </main>
  <nav id="tabs">
    <button data-tab="home" class="on"><i data-i="home"></i><span>الرئيسية</span></button>
    <button data-tab="search"><i data-i="search"></i><span>بحث</span></button>
    <button data-tab="lib"><i data-i="heart"></i><span>مكتبتي</span></button>
    <button data-tab="me"><i data-i="user"></i><span>حسابي</span></button>
  </nav>
</div>
<div id="detail" class="sheet" aria-hidden="true"></div>
<div id="browse" class="sheet" aria-hidden="true"></div>
<div id="player" aria-hidden="true"></div>
<div id="toast"></div>
<script src="android-api.js"></script>
<script src="m.js"></script>
</body>
</html>
