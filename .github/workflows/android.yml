name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor - add android + sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Stamp build version
        run: |
          VER=$(node -p "require('./package.json').version")
          RUN=${{ github.run_number }}
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d_%H:%M)
          echo "WA_TAG=v${VER}-run${RUN}-${SHA}" >> $GITHUB_ENV
          echo "window.WA_BUILD={v:'${VER}',run:${RUN},sha:'${SHA}',date:'${DATE}'};" > www/version.js
          sed -i 's#<script src="android-api.js"></script>#<script src="version.js"></script>\n<script src="android-api.js"></script>#' www/index.html
          npx cap sync android
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${RUN}/; s/versionName \"[^\"]*\"/versionName \"${VER}.${RUN}\"/" $G
          grep -n "versionCode\|versionName" $G

      - name: Native fullscreen plugin (landscape + immersive)
        run: |
          JAVA=android/app/src/main/java/com/wayanime/app
          mkdir -p $JAVA
          cp native/ImmersivePlugin.java native/MainActivity.java $JAVA/

      - name: App icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          RES=android/app/src/main/res
          ICON=assets/app-icon.png
          if [ ! -f "$ICON" ]; then echo "::warning::assets/app-icon.png غير موجود في المستودع، نستعمل assets/icon.png"; ICON=assets/icon.png; fi
          ls -la assets | head -20
          # الأيقونة صورة كاملة (مربعة): بلا trim، legacy بملء الصورة، round بقناع دائري، foreground للـ adaptive بحجم 66% فوق لون الخلفية
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            fw=$((f*66/100))
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM $RES/mipmap-$n/ic_launcher.png \( -size ${s}x${s} xc:black -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -alpha off -compose CopyOpacity -composite $RES/mipmap-$n/ic_launcher_round.png
            $IM "$ICON" -resize ${fw}x${fw} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          # Capacitor كيجي بأيقونة adaptive ديالو (X زرقاء + grid) محددة فـ XML -> نبدلوها بديالنا
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml $RES/drawable/ic_launcher_foreground.xml $RES/drawable-v24/ic_launcher_background.xml
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/wa_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="wa_icon_bg">#bf9997</color>
          </resources>
          XML
          for x in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$x.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/wa_icon_bg"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-${WA_TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-${{ env.WA_TAG }}
          path: WayAnime-${{ env.WA_TAG }}.apk
