name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate www (from the desktop sources)
        run: node android-app/make-www.js

      - name: Capacitor - add android + sync
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: App icon (best effort)
        continue-on-error: true
        run: |
          set -e
          RES=android-app/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            inner=$((f*60/100))
            convert assets/icon.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert assets/icon.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            convert assets/icon.png -resize ${inner}x${inner} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#0b0a10/I' $RES/values/ic_launcher_background.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
